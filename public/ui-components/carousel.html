    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<body>
    
    <!-- ====           HEADER         ==============================================================
    https://github.com/arbph-dev/codeIgniter/blob/master/doc/FRONTEND/UI-header.md

    on conserve les styles :  /public/assets/css/ui.css#L104-L127

    <header>
        <div class="title-layout">
            <h1 id="appTitle">Page principale</h1>
            <span id="appSubtitle">Portail personnel en déploiement</span>
        </div>

        <div class="header-actions">
            <button class="rwdnav" type="button" onclick="openNav()" aria-label="Ouvrir le menu">

    </nav>
    <!-- ====  CONTENU PRINCIPAL    ========================== -->
    <main>
        <!-- ====  ARTICLE art-admin NE PAS TOUCHER   ========================== -->
        <article id="art-admin" class="panel-card">
            <h2 class="panel-title">Administration</h2>
            <p class="panel-description">Tableau de bord administrateur</p>

            <div class="section-tab">

                <div class="tab-headers"></div>
                
                <section id="art-admin-home" class="tab-content active">
                    <h3>Home</h3>
                    <div id="art-admin-home-body"><!-- contenu ultérieur --></div>
                </section>


                <section id="art-admin-user" class="tab-content">
                    <h3>User</h3>
                    <div id="art-admin-user-list"><!-- contenu ultérieur --></div>
                </section>

            </div>

        </article>
        <!-- ====  ARTICLE art-user NE PAS TOUCHER   ========================== -->
        <article id="art-user" class="panel-card">
            <h2 class="panel-title">Mon espace</h2>
            <p class="panel-description">Profil et inscription</p>

            <div class="section-tab">

                <div class="tab-headers"></div>
                
                <section id="art-user-home" class="tab-content active">
                    <h3>Board User</h3>
                    <div id="art-user-home-body">
                        <!-- contenu ultérieur -->
                    </div>
                </section>

            </div>

        </article>

        <!-- ====  ARTICLE 0 - CALLOUT ===================== -->
        <article id="art0" class="panel-card active">
            <h2 class="panel-title">Composants CAROUSEL</h2>
            <p class="panel-description">Le composant CAROUSEL permet de gérer des séquences d'images</p>

            <div class="section-tab">

                <div class="tab-headers"></div>
                
                <section id="art0-s0" class="tab-content active">
                    <h3>Callout - info</h3>
                    
                    <div id="art0-s0-body" style="width:400px">

                        <div id="CAROUSEL_1" class="cp_carousel">
                            <img src="/assets/img/technologies/chimie/securite/pictogram-SGH01.svg">
                            <img src="/assets/img/technologies/chimie/securite/pictogram-SGH02.svg">
                            <img src="/assets/img/technologies/chimie/securite/pictogram-SGH03.svg">
                            <img src="/assets/img/technologies/chimie/securite/pictogram-SGH04.svg">
                            <img src="/assets/img/technologies/chimie/securite/pictogram-SGH05.svg">
                            <img src="/assets/img/technologies/chimie/securite/pictogram-SGH06.svg">
                            <img src="/assets/img/technologies/chimie/securite/pictogram-SGH07.svg">
                            <img src="/assets/img/technologies/chimie/securite/pictogram-SGH08.svg">
                            <img src="/assets/img/technologies/chimie/securite/pictogram-SGH09.svg">
                        </div>
                        <button onclick="window.eventBusPublish( event, 'carousel:prev', '1' )">&lt;-</button>
                        <button onclick="window.eventBusPublish( event, 'carousel:run', { id: '1', interval: 3000 } )">START</button>
                        <button onclick="window.eventBusPublish( event, 'carousel:stop' , '1' )">STOP</button>
                        <button onclick="window.eventBusPublish( event, 'carousel:next' , '1' )">-&gt;</button>
                    </div>
                </section>

                    </div>
